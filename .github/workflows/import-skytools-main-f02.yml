name: Sincronizar SKYTOOLS Main Web F02 desde ZIP aprobado

on:
  push:
    branches: [main]
    paths:
      - 'SKYTOOLS-ECOSYSTEM-MAIN-F02-FINAL-v2-Namecheap.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Validar paquete aprobado
        shell: bash
        run: |
          set -euo pipefail
          ZIP="SKYTOOLS-ECOSYSTEM-MAIN-F02-FINAL-v2-Namecheap.zip"
          test -f "$ZIP"
          echo "74ec55be3041f162e315563fc64f17692953b1a731de7058284d8a02f6937cf9  $ZIP" | sha256sum -c -
          unzip -tq "$ZIP"
          mkdir -p /tmp/skytools-f02-verified
          unzip -q "$ZIP" -d /tmp/skytools-f02-verified
          test -f /tmp/skytools-f02-verified/index.html
          test -f /tmp/skytools-f02-verified/assets/css/styles.css
          test -f /tmp/skytools-f02-verified/assets/js/main.js
          test -f /tmp/skytools-f02-verified/assets/js/lead-config.js
          test -f /tmp/skytools-f02-verified/assets/img/bic-original.png
          test -f /tmp/skytools-f02-verified/robots.txt
          test -f /tmp/skytools-f02-verified/sitemap.xml
          echo "8f5424461608004a81a31402fd0384d318ba8cdfaad3b5b3da9c6bcb3ae14de3  /tmp/skytools-f02-verified/index.html" | sha256sum -c -
          echo "4ee054b7c90a11733db2a6ab67c5f43273503ca80c83c69c41dad53f0ef46d08  /tmp/skytools-f02-verified/assets/css/styles.css" | sha256sum -c -

      - name: Reemplazar fuentes web y conservar docs y .github
        shell: bash
        run: |
          set -euo pipefail
          test -d /tmp/skytools-f02-verified/assets
          rm -rf assets
          cp -a /tmp/skytools-f02-verified/. .
          git add -A assets
          git add -A --             index.html README.md robots.txt sitemap.xml site.webmanifest             favicon.ico favicon.png favicon-16x16.png favicon-32x32.png             favicon-64x64.png apple-touch-icon.png             android-chrome-192x192.png android-chrome-512x512.png             FASE02-REVISION.md
          git diff --cached --check

      - name: Commit aprobado a main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "El contenido web ya está sincronizado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: sincronizar SKYTOOLS ECOSYSTEM Main F02 final v2"
          git push origin HEAD:main
